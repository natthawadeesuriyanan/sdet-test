# Enables parallel execution across test CLASSES (CoreFlowTest, EdgeCoverageTest,
# ProblemUserTest each get their own thread), while tests WITHIN a class still
# run sequentially (same_thread). This matches Playwright's own guidance
# (playwright.dev/java/docs/test-runners): Playwright/Browser objects are not
# safe to share across threads, so each class — with its own non-static
# Playwright/Browser instance (see BaseTest's @TestInstance(PER_CLASS)) —
# runs entirely on one thread, and different classes run concurrently on
# different threads instead.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# Dynamic factor 0.5: use half of the available CPU cores as the thread pool
# size, leaving headroom for the host machine (or CI runner) to stay
# responsive rather than saturating every core with browser processes.
junit.jupiter.execution.parallel.config.strategy = dynamic
junit.jupiter.execution.parallel.config.dynamic.factor = 0.5
